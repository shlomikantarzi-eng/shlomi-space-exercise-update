<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Space Exercise Daily</title>
<style>
:root{
  --bg:#101317; --surface:#181c22; --surface2:#1f252d; --line:#2a313a;
  --text:#e8eaed; --muted:#98a2ad; --faint:#6b7480;
  --accent:#7cb7a6; --accent-soft:rgba(124,183,166,.14); --accent-ink:#0e1a16;
  --warm:#d9b46e; --warm-soft:rgba(217,180,110,.14);
  --radius:14px; --tab-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  line-height:1.5;padding-bottom:calc(var(--tab-h) + var(--safe-b) + 16px)}
button{font:inherit;color:inherit}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:0 14px}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:right}
.n{unicode-bidi:isolate;white-space:nowrap}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(16,19,23,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.hrow{display:flex;align-items:center;gap:8px;padding:8px 0 4px}
.brand{font-size:.8125rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.weekpill{margin-inline-start:auto;display:flex;align-items:center;gap:4px}
.nav-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;font-size:1rem;cursor:pointer}
.weektxt{min-width:112px;text-align:center;font-weight:700;font-size:.9375rem}
.weektxt small{display:block;font-weight:500;color:var(--muted);font-size:.75rem;line-height:1.2}
.today-btn{display:none;border:1px solid var(--warm);color:var(--warm);background:transparent;border-radius:10px;
  padding:0 10px;height:36px;font-size:.8125rem;font-weight:700;cursor:pointer}
.today-btn.show{display:block}
.prog{height:3px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:2px 0 8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* day strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding-bottom:10px}
.dbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:5px 2px 4px;text-align:center;cursor:pointer;min-height:50px}
.dbtn b{display:block;font-size:1rem}
.dbtn span{display:block;font-size:.6875rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtn.gym b{color:var(--text)}
.dbtn.light b{color:var(--muted)}
.dbtn.sel{background:var(--accent);border-color:var(--accent)}
.dbtn.sel b,.dbtn.sel span{color:var(--accent-ink)}
.dbtn.today::after{content:"";position:absolute;top:5px;left:5px;width:7px;height:7px;border-radius:50%;background:var(--warm)}
.dbtn.done::before{content:"✓";position:absolute;top:2px;right:6px;font-size:.6875rem;font-weight:800;color:var(--accent)}
.dbtn.sel.done::before{color:var(--accent-ink)}

/* day hero */
.hero{margin:16px 0 12px}
.hero .dayname{font-size:1.75rem;font-weight:800;line-height:1.2;margin:0}
.hero .daytitle{font-size:1.125rem;font-weight:600;color:var(--accent);margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8125rem;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.strong{color:var(--text)}
.note{margin:12px 0;padding:12px 14px;border-radius:12px;font-size:.9375rem;border:1px solid var(--line);background:var(--surface)}
.note.warm{border-color:rgba(217,180,110,.45);background:var(--warm-soft)}
.note.accent{border-color:rgba(124,183,166,.45);background:var(--accent-soft)}
.note b{color:var(--text)}
.section-label{font-size:.8125rem;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:20px 2px 8px}

/* exercise card */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.ex-top{display:flex;gap:12px;align-items:flex-start}
.num{flex:0 0 32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:800;font-size:.9375rem}
.ex.heavy .num{background:var(--warm-soft);color:var(--warm)}
.ex-name{font-size:1.125rem;font-weight:700;line-height:1.35;margin:0}
.ex-en{font-size:.8125rem;color:var(--faint);margin-top:2px}
.ex-target{font-size:.875rem;color:var(--muted);margin-top:2px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.stat{border-radius:10px;padding:6px 12px;background:var(--surface2);font-size:.875rem;color:var(--muted)}
.stat.main{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1rem}
.ex.heavy .stat.main{background:var(--warm);color:#1d160a}
.tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--warm-soft);color:var(--warm);margin-inline-start:6px;vertical-align:2px}
.load{font-size:.875rem;color:var(--muted);margin-top:10px}
.alt{margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--surface2);font-size:.875rem;color:var(--muted)}
.alt b{color:var(--text);font-weight:600}
details.how{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
details.how summary{list-style:none;cursor:pointer;font-weight:600;font-size:.9375rem;color:var(--accent);padding:8px 0;display:flex;align-items:center;gap:6px}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin-top:-4px}
details.how[open] summary::after{transform:rotate(225deg);margin-top:4px}
details.how ol{margin:4px 0 8px;padding-inline-start:20px;font-size:.9375rem}
details.how li{margin-bottom:6px}
.vbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface2);color:var(--text);text-decoration:none;font-weight:600;font-size:.9375rem;margin-top:6px}
.donebar{margin:18px 0 8px}
.donebtn{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--accent);background:transparent;color:var(--accent);
  font-weight:800;font-size:1rem;cursor:pointer}
.donebtn.on{background:var(--accent);color:var(--accent-ink)}
.walk-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.walk-card ul{margin:6px 0 0;padding-inline-start:20px}

/* year tab */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.card h2{font-size:1.25rem;margin:0 0 4px}
.card h3{font-size:1rem;margin:0 0 6px}
.card p{margin:4px 0;color:var(--muted);font-size:.9375rem}
.card ul{margin:6px 0 0;padding-inline-start:20px;font-size:.9375rem}
.card li{margin-bottom:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1rem}
.kpi span{font-size:.75rem;color:var(--muted)}
.blk{margin:14px 0}
.blk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.blk-h b{font-size:.9375rem}
.blk-h span{font-size:.75rem;color:var(--muted)}
.weeks{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.wk{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.8125rem;font-weight:700;
  display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.wk.past{background:var(--surface2);color:var(--faint)}
.wk.del{border-style:dashed}
.wk.cur{background:var(--warm);color:#1d160a;border-color:var(--warm)}
.wk.view{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.75rem;color:var(--muted);margin-top:6px}

/* nutrition */
.totals{position:sticky;top:calc(var(--hdr,90px) + 8px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:12px 0}
.tot-row{display:flex;justify-content:space-between;font-size:.875rem;color:var(--muted)}
.tot-row b{color:var(--text);font-size:1.25rem}
.bar{height:8px;background:var(--surface2);border-radius:8px;overflow:hidden;margin-top:8px;position:relative}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.over{background:var(--warm)}
.meal h3{font-size:1rem;margin:18px 2px 8px}
.opt{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt b{font-size:.9375rem}
.opt p{margin:4px 0 0;font-size:.8125rem;color:var(--muted)}
.opt .mac{font-size:.75rem;color:var(--faint);margin-top:4px}

/* guide */
.set-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.set-row input{flex:1;min-width:150px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);padding:0 12px;font-size:1rem}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:0 14px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger.arm{border-color:var(--warm);color:var(--warm)}

/* tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#181c22;border-top:1px solid var(--line);
  padding-bottom:var(--safe-b)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--faint);font-size:.75rem;font-weight:600;cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.page{display:none}.page.on{display:block}
body:not(.p-day) .strip, body:not(.p-day) .fab{display:none}

/* timer */
.fab{position:fixed;left:12px;bottom:calc(var(--tab-h) + var(--safe-b) + 12px);z-index:31;height:52px;min-width:52px;padding:0 14px;justify-content:center;
  border-radius:26px;border:0;background:var(--surface2);color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.45);
  font-weight:800;font-size:1rem;display:flex;align-items:center;gap:8px;cursor:pointer;outline:1px solid var(--line)}
.fab.run{background:var(--warm);color:#1d160a}
.fab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .box{width:100%;max-width:720px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
.sheet h3{margin:0 0 12px;font-size:1.0625rem}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tgrid .btn{min-height:56px;font-size:1rem}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <div class="brand">SPACE DAILY</div>
      <button class="today-btn" id="todayBtn">חזרה להיום</button>
      <div class="weekpill">
        <button class="nav-btn" id="prevW" aria-label="שבוע קודם">›</button>
        <div class="weektxt" id="weekTxt"></div>
        <button class="nav-btn" id="nextW" aria-label="שבוע הבא">‹</button>
      </div>
    </div>
    <div class="prog"><i id="progBar"></i></div>
    <div class="strip" id="strip"></div>
  </div>
</header>

<main class="wrap">
  <section class="page on" id="p-day"></section>
  <section class="page" id="p-year"></section>
  <section class="page" id="p-food"></section>
  <section class="page" id="p-guide"></section>
</main>

<button class="fab" id="fab" aria-label="טיימר מנוחה">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="fabTxt"></span>
</button>
<div class="sheet" id="sheet"><div class="box">
  <h3>טיימר מנוחה</h3>
  <div class="tgrid">
    <button class="btn" data-t="60">1:00</button><button class="btn" data-t="90">1:30</button>
    <button class="btn" data-t="120">2:00</button><button class="btn" data-t="180">3:00</button>
  </div>
  <div class="set-row"><button class="btn" id="tStop" style="flex:1">עצירה</button><button class="btn" id="tClose" style="flex:1">סגירה</button></div>
</div></div>

<nav class="tabs"><div class="in">
  <button class="tab on" data-p="day"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>אימון</button>
  <button class="tab" data-p="year"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>שנה</button>
  <button class="tab" data-p="food"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8M3 3v8a2 2 0 0 0 2 2M17 21V3c2.5 1.5 4 4.5 4 8h-4"/></svg>תזונה</button>
  <button class="tab" data-p="guide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>מדריך</button>
</div></nav>

const DAYS = ["יום ראשון","יום שני","יום שלישי","יום רביעי","יום חמישי","יום שישי","שבת"];

    if (p.extras.length){
      h += '<div class="section-label">בבית, במהלך יום העבודה · אופציונלי</div>';
      h += '<div class="note">בונוס, לא חובה. 4 סטים מכל אחד לאורך היום. מדלגים אחרי לילה קצר, כשהמשקלים בחדר הכושר יורדים, או כשהקמיצה מגיבה.</div>';
      h += p.extras.map((it,i)=>exCard(it,i,false,true)).join("");
    }
  }
  const on = isDone(state.week,state.dow);
  h += '<div class="donebar"><button class="donebtn'+(on?" on":"")+'" id="doneBtn">'+(on?"✓ בוצע":"סימון: בוצע")+'</button></div>';
  $("#p-day").innerHTML = h;
  $("#doneBtn").onclick = () => { const k=doneKey(state.week,state.dow); isDone(state.week,state.dow)?LS.del(k):LS.set(k,"1"); render(); };
}

function renderYear(){
  const cur = blockOf(TODAY.week), N = DATA.nutrition[cur.nut || blockOf(TODAY.week+1 > 52 ? 1 : TODAY.week+1).nut || "build"];
  let h = '<div class="card"><h2>'+esc(cur.title)+'</h2><p>'+esc(cur.goal || "שבוע קל להתאוששות. בסופו מתחילים את הבלוק הבא.")+'</p>';
  h += '<div class="kpis"><div class="kpi"><b>'+TODAY.week+'/52</b><span>שבוע</span></div><div class="kpi"><b>'+esc(N.kcal)+'</b><span>קק"ל ביום</span></div><div class="kpi"><b>'+esc(N.p)+'</b><span>חלבון</span></div></div></div>';
  h += '<div class="card"><h3>היעד לשנה</h3><ul><li>עלייה של 1–3 ק"ג שריר. זה הטווח הריאלי אחרי 15 שנות אימון.</li><li>ירידה בהיקף המותניים ובאחוז השומן, בעיקר בבלוקים 1 ו-4.</li><li>עלייה במשקלים בתרגילים הראשיים בכל בלוק לעומת הבלוק המקביל.</li></ul></div>';
  DATA.blocks.forEach(b => {
    if (b.deload) return;
    const del = DATA.blocks.find(x => x.deload && x.w[0]===b.w[1]+1);
    const weeks = []; for (let w=b.w[0]; w<=(del?del.w[0]:b.w[1]); w++) weeks.push(w);
    h += '<div class="blk"><div class="blk-h"><b>'+esc(b.title)+'</b><span>שבועות '+b.w[0]+'–'+(del?del.w[0]:b.w[1])+' · '+esc(DATA.nutrition[b.nut].label)+'</span></div><div class="weeks">';
    weeks.forEach(w => {
      const c = ["wk"]; if (w<TODAY.week && !TODAY.before) c.push("past"); if (w===TODAY.week && !TODAY.before) c.push("cur");
      if (blockOf(w).deload) c.push("del"); if (w===state.week) c.push("view");
      h += '<button class="'+c.join(" ")+'" data-w="'+w+'">'+w+'</button>';
    });
    h += '</div></div>';
  });
  h += '<div class="legend"><span>מסגרת מקווקוות = שבוע הקלה</span><span>צהוב = השבוע הנוכחי</span><span>לחיצה = מעבר לשבוע</span></div>';
  h += '<p style="color:var(--faint);font-size:.8125rem;margin:12px 0">'+'התחלה: '+fmt(startDate())+'. אחרי שבוע 52 מתחילים סבב חדש משבוע 1.'+(TODAY.cycle>1?' כרגע: סבב '+TODAY.cycle+'.':'')+'</p>';
  $("#p-year").innerHTML = h;
  $("#p-year").querySelectorAll(".wk").forEach(el => el.onclick = () => { state.week=+el.dataset.w; state.dow=0; showPage("day"); render(); });
}

function renderFood(){
  const b = blockOf(state.week), key = b.nut, N = DATA.nutrition[key];
  const sk = "sy_meals_"+key;
  let sel; try { sel = JSON.parse(LS.get(sk,"null")); } catch(e) { sel = null; }
  if (!sel) sel = JSON.parse(JSON.stringify(DATA.mealDefaults[key]));
  const tot = {kcal:0,p:0,c:0,f:0};
  DATA.meals.forEach(m => { const pick = [].concat(sel[m.id] ?? []); pick.forEach(i => { const o = m.options[i]; if (o) ["kcal","p","c","f"].forEach(k => tot[k]+=o[k]); }); });
  const hi = N.range[1], pct = Math.min(100, tot.kcal/hi*100);
  let h = '<div class="card"><h2>'+esc(N.label)+'</h2><p>שבוע '+state.week+' · '+esc(b.title)+'</p>';
  h += '<div class="kpis"><div class="kpi"><b>'+esc(N.kcal)+'</b><span>קק"ל ביום</span></div><div class="kpi"><b>'+esc(N.p)+'</b><span>חלבון</span></div><div class="kpi"><b style="font-size:.8125rem">'+esc(N.rate)+'</b><span>קצב</span></div></div>';
  h += '<ul style="margin-top:12px">'+N.rules.map(r=>'<li>'+esc(r)+'</li>').join("")+'</ul></div>';
  h += '<div class="totals"><div class="tot-row"><span>סה"כ היום</span><span><b>'+tot.kcal+'</b> / '+esc(N.kcal)+' קק"ל</span></div>';
  h += '<div class="bar"><i class="'+(tot.kcal>hi?"over":"")+'" style="width:'+pct+'%"></i></div>';
  h += '<div class="tot-row" style="margin-top:8px"><span>חלבון '+tot.p+' גר\'</span><span>פחמימה '+tot.c+' גר\'</span><span>שומן '+tot.f+' גר\'</span></div></div>';
  if (tot.kcal < N.range[0]) h += '<div class="note">חסרות כ-'+(N.range[0]-tot.kcal)+' קק"ל ליעד. אפשר להוסיף נשנוש מהרשימה.</div>';
  if (tot.kcal > hi) h += '<div class="note warm">יותר מהיעד בכ-'+(tot.kcal-hi)+' קק"ל. אפשר להוריד נשנוש או לבחור ארוחה קלה יותר.</div>';
  DATA.meals.forEach(m => {
    const multi = m.id==="s", pick = [].concat(sel[m.id] ?? []);
    h += '<div class="meal"><h3>'+esc(m.title)+(multi?' <span style="font-weight:500;color:var(--muted);font-size:.8125rem">(אפשר לבחור כמה)</span>':'')+'</h3>';
    m.options.forEach((o,j) => {
      h += '<button class="opt'+(pick.includes(j)?" on":"")+'" data-m="'+m.id+'" data-j="'+j+'"><b>'+esc(o.name)+'</b>'+(o.tag?'<span class="tag">'+esc(o.tag)+'</span>':'')+'<p>'+esc(o.desc)+'</p><div class="mac">'+o.kcal+' קק"ל · חלבון '+o.p+' · פחמימה '+o.c+' · שומן '+o.f+'</div></button>';
    });
    h += '</div>';
  });
  h += '<div class="set-row" style="margin-bottom:12px"><button class="btn" id="mealReset">חזרה לתפריט המומלץ</button></div>';
  $("#p-food").innerHTML = h;
  $("#p-food").querySelectorAll(".opt").forEach(el => el.onclick = () => {
    const m = el.dataset.m, j = +el.dataset.j;
    if (m==="s") { const a = [].concat(sel.s ?? []); const k = a.indexOf(j); k>=0 ? a.splice(k,1) : a.push(j); sel.s = a; }
    else sel[m] = j;
    LS.set(sk, JSON.stringify(sel)); renderFood(); });
  $("#mealReset").onclick = () => { LS.del(sk); renderFood(); };
}

function renderGuide(){
  let h = DATA.guide.map(g => '<div class="card"><h3>'+esc(g.title)+'</h3><ul>'+g.points.map(p=>'<li>'+nb(p)+'</li>').join("")+'</ul></div>').join("");
  h += '<div class="card"><h3>הגדרות</h3><p>תאריך התחלה של התוכנית (יום ראשון):</p><div class="set-row"><input type="date" id="stIn" value="'+LS.get("sy_start",DATA.start)+'"><button class="btn pri" id="stSave">שמירה</button></div>';
  h += '<div class="set-row"><button class="btn danger" id="reset">איפוס סימוני "בוצע"</button></div></div>';
  $("#p-guide").innerHTML = h;
  $("#stSave").onclick = () => { const v=$("#stIn").value; if(v){LS.set("sy_start",v); location.reload();} };
  const r = $("#reset"); let armed=false;
  r.onclick = () => { if(!armed){armed=true;r.classList.add("arm");r.textContent="לחיצה נוספת לאישור";setTimeout(()=>{armed=false;r.classList.remove("arm");r.textContent='איפוס סימוני "בוצע"'},3000);return;}
    try{Object.keys(localStorage).filter(k=>k.startsWith("sy_done_")).forEach(k=>localStorage.removeItem(k))}catch(e){} render(); renderGuide(); };
}

function showPage(p){
  state.page=p; document.body.className="p-"+p;
  requestAnimationFrame(()=>document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight+"px"));
  document.querySelectorAll(".page").forEach(el=>el.classList.toggle("on", el.id==="p-"+p));
  document.querySelectorAll(".tab").forEach(el=>el.classList.toggle("on", el.dataset.p===p));
}
function render(){
  renderHeader(); renderDay(); renderYear(); renderFood();
}
document.querySelectorAll(".tab").forEach(el => el.onclick = () => { showPage(el.dataset.p); if(el.dataset.p==="guide") renderGuide(); window.scrollTo(0,0); });
$("#prevW").onclick = () => { state.week = state.week>1 ? state.week-1 : 52; render(); };
$("#nextW").onclick = () => { state.week = state.week<52 ? state.week+1 : 1; render(); };
$("#todayBtn").onclick = () => { state.week=TODAY.week; state.dow=NOW.getDay(); showPage("day"); render(); window.scrollTo(0,0); };

// rest timer
let tEnd=0, tInt=null;
function tick(){ const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  $("#fabTxt").textContent = left ? Math.floor(left/60)+":"+String(left%60).padStart(2,"0") : "";
  $("#fab").classList.toggle("run", left>0);
  if(!left){ clearInterval(tInt); tInt=null; if(tEnd){ try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){} tEnd=0; } } }
$("#fab").onclick = () => $("#sheet").classList.add("on");
$("#tClose").onclick = () => $("#sheet").classList.remove("on");
$("#sheet").onclick = e => { if(e.target.id==="sheet") $("#sheet").classList.remove("on"); };
$("#tStop").onclick = () => { tEnd=0; clearInterval(tInt); tInt=null; tick(); $("#sheet").classList.remove("on"); };
document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tEnd=Date.now()+(+b.dataset.t)*1000; clearInterval(tInt); tInt=setInterval(tick,500); tick(); $("#sheet").classList.remove("on"); });

showPage("day"); render(); renderGuide();
if ("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
